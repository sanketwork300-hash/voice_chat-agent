<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Support Agent</title>
  <desc id="desc">A voice and chat agent that checks AWS resources, finds the fault, and changes nothing until the customer confirms.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6ce4ff" stroke-opacity="0.06" />
    </pattern>
    <radialGradient id="gridFade" cx="30%" cy="0%" r="90%">
      <stop offset="0" stop-color="#fff" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#gridFade)" /></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60" /></filter>
    <radialGradient id="core" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#e9fbff" />
      <stop offset="0.25" stop-color="#6ce4ff" />
      <stop offset="0.8" stop-color="#9d8cff" />
      <stop offset="1" stop-color="#3b3170" />
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ce4ff" stop-opacity="0" />
      <stop offset="0.6" stop-color="#6ce4ff" />
      <stop offset="1" stop-color="#9d8cff" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ce4ff" />
      <stop offset="1" stop-color="#9d8cff" />
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="360" rx="24" /></clipPath>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .glow-a { animation: drift 16s ease-in-out infinite alternate; }
    .glow-b { animation: drift 20s ease-in-out infinite alternate-reverse; }
    @keyframes drift { to { transform: translate(90px, 40px); } }
    .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 3s cubic-bezier(.2,.6,.3,1) infinite; }
    .ripple.late { animation-delay: 1.5s; }
    @keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
    .core { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.06); } }
    .spin { transform-box: view-box; transform-origin: 230px 160px; animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bar { transform-box: fill-box; transform-origin: center; animation: wave 1.1s ease-in-out infinite; }
    @keyframes wave { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
    .t { opacity: 0; animation: tick 12s infinite; }
    .t2 { animation-delay: 3s; } .t3 { animation-delay: 6s; } .t4 { animation-delay: 9s; }
    @keyframes tick { 0% { opacity: 0; transform: translateY(8px); } 3%, 22% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; } }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .t1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#060a16" />
    <circle class="glow-a" cx="180" cy="40" r="200" fill="#6ce4ff" opacity="0.18" filter="url(#blur)" />
    <circle class="glow-b" cx="1040" cy="20" r="220" fill="#9d8cff" opacity="0.2" filter="url(#blur)" />
    <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)" />

    <!-- The orb -->
    <circle class="ripple" cx="230" cy="160" r="78" fill="none" stroke="#6ce4ff" stroke-width="1.5" />
    <circle class="ripple late" cx="230" cy="160" r="78" fill="none" stroke="#9d8cff" stroke-width="1.5" />
    <circle cx="230" cy="160" r="96" fill="none" stroke="#6ce4ff" stroke-opacity="0.25" />
    <circle class="spin" cx="230" cy="160" r="104" fill="none" stroke="url(#arc)" stroke-width="2" stroke-linecap="round" stroke-dasharray="160 494" />
    <circle cx="230" cy="160" r="86" fill="#6ce4ff" opacity="0.18" filter="url(#blur)" />
    <circle class="core" cx="230" cy="160" r="70" fill="url(#core)" />

    <!-- Waveform under the orb -->
    <g fill="url(#bar)">
      <rect class="bar" x="150" y="288" width="4" height="28" rx="2" style="animation-delay:-.1s" />
      <rect class="bar" x="160" y="284" width="4" height="36" rx="2" style="animation-delay:-.5s" />
      <rect class="bar" x="170" y="280" width="4" height="44" rx="2" style="animation-delay:-.3s" />
      <rect class="bar" x="180" y="276" width="4" height="52" rx="2" style="animation-delay:-.8s" />
      <rect class="bar" x="190" y="282" width="4" height="40" rx="2" style="animation-delay:-.2s" />
      <rect class="bar" x="200" y="274" width="4" height="56" rx="2" style="animation-delay:-.6s" />
      <rect class="bar" x="210" y="278" width="4" height="48" rx="2" style="animation-delay:-.9s" />
      <rect class="bar" x="220" y="272" width="4" height="60" rx="2" style="animation-delay:-.4s" />
      <rect class="bar" x="230" y="276" width="4" height="52" rx="2" style="animation-delay:-.7s" />
      <rect class="bar" x="240" y="272" width="4" height="60" rx="2" style="animation-delay:-.15s" />
      <rect class="bar" x="250" y="278" width="4" height="48" rx="2" style="animation-delay:-.55s" />
      <rect class="bar" x="260" y="274" width="4" height="56" rx="2" style="animation-delay:-.35s" />
      <rect class="bar" x="270" y="282" width="4" height="40" rx="2" style="animation-delay:-.85s" />
      <rect class="bar" x="280" y="276" width="4" height="52" rx="2" style="animation-delay:-.25s" />
      <rect class="bar" x="290" y="280" width="4" height="44" rx="2" style="animation-delay:-.65s" />
      <rect class="bar" x="300" y="284" width="4" height="36" rx="2" style="animation-delay:-.45s" />
      <rect class="bar" x="310" y="288" width="4" height="28" rx="2" style="animation-delay:-.75s" />
    </g>

    <!-- Words -->
    <text x="420" y="132" font-size="58" font-weight="700" fill="#e6ebff" letter-spacing="-1.5">Cloud Support Agent</text>
    <text x="422" y="178" font-size="21" fill="#8a93b5">Talk or type. It checks your AWS resources, finds the fault,</text>
    <text x="422" y="206" font-size="21" fill="#8a93b5">and changes nothing until you say yes.</text>

    <!-- What the agent is doing right now, on a loop -->
    <rect x="420" y="246" width="440" height="44" rx="12" fill="#0d1325" stroke="#222b46" />
    <circle class="blink" cx="444" cy="268" r="5" fill="#4ade9b" />
    <g font-size="17" fill="#e6ebff">
      <text class="t t1" x="462" y="274">Listening</text>
      <text class="t t2" x="462" y="274">Checking security groups on demo-web-01</text>
      <text class="t t3" x="462" y="274">Proposing: allow SSH from 203.0.113.10</text>
      <text class="t t4" x="462" y="274">Applied and verified</text>
    </g>

    <g font-size="14" fill="#8a93b5">
      <text x="880" y="274">EC2, S3, Lambda, IAM, CloudWatch</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="24" fill="none" stroke="#222b46" />
</svg>
