# Pages ingested into the knowledge base by scripts/ingest_docs.py.
#
# Source: the archived `awsdocs` repositories on GitHub, each pinned to the last
# commit that still contains the documentation (the final commit of each
# repository deleted it). `source_date` is the date of that commit. The pages are
# downloaded into datasets/knowledge/corpus/ (not committed) and are a snapshot:
# treat them as background troubleshooting knowledge, not as current prices or limits.
#
# `category` is free text used as chunk metadata. Add a page by adding a line here
# and running `make ingest`; removing a line removes its chunks on the next run.

source: aws_documentation

