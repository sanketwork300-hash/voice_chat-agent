# Scrapes the backend's /metrics. Prometheus runs with host networking, so the
# backend is reachable at localhost:8010 whether it runs on the host or as the
# `backend` Compose service (which publishes 8010 on the host).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["localhost:8010"]
